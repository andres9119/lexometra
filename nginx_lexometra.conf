# ── Lexometra — Nginx site configuration ─────────────────
# Place in /etc/nginx/sites-available/lexometra
# Then: ln -s /etc/nginx/sites-available/lexometra /etc/nginx/sites-enabled/
# Then: nginx -t && systemctl reload nginx

upstream lexometra_app {
    server unix:/run/lexometra.sock fail_timeout=0;
}

server {
    listen 80;
    server_name lexometra.tudominio.com www.lexometra.tudominio.com;
    return 301 https://$server_name$request_uri;
}

server {
    listen 443 ssl http2;
    server_name lexometra.tudominio.com www.lexometra.tudominio.com;

    # ── SSL (Let's Encrypt / Certbot) ──────────────────
    ssl_certificate     /etc/letsencrypt/live/lexometra.tudominio.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/lexometra.tudominio.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    # ── Security headers ───────────────────────────────
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options nosniff;
    add_header X-Frame-Options SAMEORIGIN;
    add_header X-XSS-Protection "1; mode=block";

    # ── Logs ───────────────────────────────────────────
    access_log /var/log/nginx/lexometra_access.log;
    error_log  /var/log/nginx/lexometra_error.log;

    # ── Static files ───────────────────────────────────
    location /static/ {
        alias /home/lexometra/lexometra/staticfiles/;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # ── Media files ────────────────────────────────────
    location /media/ {
        alias /home/lexometra/lexometra/media/;
        expires 7d;
        add_header Cache-Control "public";
    }

    # ── Application ────────────────────────────────────
    location / {
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
        proxy_pass http://lexometra_app;

        # WebSocket support (for Django Channels, future use)
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # ── Large uploads (documents up to 50MB) ───────────
    client_max_body_size 50M;
}
